import com.ciscowebex.androidsdk.build.*

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'  // Google Services plugin
apply plugin: 'com.google.firebase.crashlytics' // Crashlytics Gradle plugin

def CLIENT_ID='""'
def CLIENT_SECRET='""'
def REDIRECT_URI='""'
def FEDRAMP_CLIENT_ID='""'
def FEDRAMP_CLIENT_SECRET='""'
def FEDRAMP_REDIRECT_URI='""'
def WEBHOOK_URL='""'

android {
    compileSdk Versions.compileSdk
    ndkVersion Versions.ndkVersion

    compileOptions {
        sourceCompatibility Versions.jvmVersion
        targetCompatibility Versions.jvmVersion
    }

    kotlinOptions {
        jvmTarget = Versions.jvmTarget
    }
    defaultConfig {
        applicationId "com.cisco.sdk_android"
        minSdkVersion Versions.minSdk
        targetSdkVersion Versions.targetSdk
        versionCode 3160201
        versionName "3.16.2.1-ondemand"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        Properties properties = new Properties()
        if (project.rootProject.file('local.properties').canRead()) {
            properties.load(project.rootProject.file("local.properties").newDataInputStream())

            //All the values will be read from local.properties file
            CLIENT_ID = properties.getProperty('CLIENT_ID', '""')
            CLIENT_SECRET = properties.getProperty('CLIENT_SECRET', '""')
            REDIRECT_URI = properties.getProperty('REDIRECT_URI', '" "')
            FEDRAMP_CLIENT_ID = properties.getProperty('FEDRAMP_CLIENT_ID', '""')
            FEDRAMP_CLIENT_SECRET = properties.getProperty('FEDRAMP_CLIENT_SECRET', '""')
            FEDRAMP_REDIRECT_URI = properties.getProperty('FEDRAMP_REDIRECT_URI','""')
            WEBHOOK_URL = properties.getProperty('WEBHOOK_URL', '""')
        }

        buildConfigField "String", "CLIENT_ID", "${CLIENT_ID}"
        buildConfigField "String", "CLIENT_SECRET", "${CLIENT_SECRET}"
        buildConfigField "String", "REDIRECT_URI", "${REDIRECT_URI}"
        buildConfigField "String", "FEDRAMP_CLIENT_ID", "${FEDRAMP_CLIENT_ID}"
        buildConfigField "String", "FEDRAMP_CLIENT_SECRET", "${FEDRAMP_CLIENT_SECRET}"
        buildConfigField "String", "FEDRAMP_REDIRECT_URI", "${FEDRAMP_REDIRECT_URI}"
        buildConfigField "String", "WEBHOOK_URL", "${WEBHOOK_URL}"

        // SCOPE value is from Gradle.prop
        buildConfigField "String", "SCOPE", "${SCOPE}"
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/armeabi-v7a/libc++_shared.so', 'lib/arm64-v8a/libc++_shared.so', 'lib/x86/libc++_shared.so', 'lib/x86_64/libc++_shared.so']
            useLegacyPackaging true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    buildFeatures {
        dataBinding true
        buildConfig = true
    }
    // ABI splits are not needed for App Bundle with dynamic feature modules
    // The Play Store handles ABI-specific delivery automatically
    
    flavorDimensions 'sdktype'
    productFlavors {
        full {
            dimension 'sdktype'
            matchingFallbacks = ["full"]
        }
        meeting {
            dimension 'sdktype'
            versionNameSuffix '-meeting'
            matchingFallbacks = ["meeting"]
        }
        wxc {
            dimension 'sdktype'
            versionNameSuffix '-wxc'
            matchingFallbacks = ["wxc"]
        }
        message {
            dimension 'sdktype'
            versionNameSuffix '-message'
            matchingFallbacks = ["message"]
        }
    }
    namespace 'com.ciscowebex.androidsdk.kitchensink.base'
    
    // Dynamic feature module declaration
    dynamicFeatures = [':webexfeature']
}

dependencies {
    // Note: Webex SDK is now in the dynamic feature module (webexfeature)
    // The SDK dependency has been moved to webexfeature/build.gradle
    
    api fileTree(dir: "libs", include: ["*.jar"])
    
    // Core Android dependencies - use 'api' so feature module can access them
    api Dependencies.coreKtx
    api Dependencies.appCompat
    api Dependencies.constraintLayout
    api Dependencies.material
    api Dependencies.recyclerview
    api Dependencies.cardview
    api Dependencies.viewpager2
    api Dependencies.koin
    api Dependencies.koinViewModel
    api Dependencies.swiperefresh
    api Dependencies.media
    api Dependencies.nimbusJosh

    // RXJAVA
    api Dependencies.rxjava
    api Dependencies.rxandroid
    api Dependencies.rxkotlin

    // Test dependencies
    testImplementation Dependencies.Test.junit
    androidTestImplementation Dependencies.Test.androidxJunit
    androidTestImplementation Dependencies.Test.espressoCore
    androidTestImplementation Dependencies.Test.espressoContrib
    androidTestImplementation Dependencies.Test.espressoWeb
    androidTestImplementation Dependencies.Test.espressoIntents
    androidTestImplementation Dependencies.Test.rules
    androidTestImplementation Dependencies.Test.testExt
    debugImplementation (Dependencies.Test.fragmentScenerio) {
        exclude group: 'androidx.test', module: 'monitor'
    }
    
    // Firebase - use 'api' so feature module can access Firebase
    api platform(Dependencies.firebaseBom)
    api Dependencies.firebaseMessaging
    api Dependencies.firebaseAnalytics
    api Dependencies.firebaseCrashlytics
    
    // Common utilities
    api Dependencies.gson
    api Dependencies.glide
    api 'com.orhanobut:logger:2.2.0'
    api 'com.squareup.okhttp3:okhttp:4.10.0'
    api 'com.squareup.okio:okio:3.2.0'
    
    // Play Feature Delivery for on-demand module installation
    api 'com.google.android.play:feature-delivery-ktx:2.1.0'
    
    // Splash screen for Android 12+ compatibility (1.0.1 is compatible with compileSdk 34)
    implementation 'androidx.core:core-splashscreen:1.0.1'
    
    // Kotlin reflection for dynamic class loading
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
}
